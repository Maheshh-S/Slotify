spring:
  application:
    name: slotify
  datasource:
    url: jdbc:postgresql://localhost:5432/slotify_db
    username: postgres
    password: password
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: simple

server:
  port: 8080
  shutdown: graceful

logging:
  level:
    tech.mahesh.slotify: DEBUG
    org.springframework.security: DEBUG