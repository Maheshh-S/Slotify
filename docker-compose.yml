version: '3.8'

services:
  app:
    build: .
    container_name: slotify-app
    ports: ["8080:8080"]
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/slotify_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      db:
        condition: service_healthy
    networks: [slotify-backend]

  db:
    image: postgres:15-alpine
    container_name: slotify-db
    environment:
      - POSTGRES_DB=slotify_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports: ["5432:5432"]
    volumes: [slotify-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [slotify-backend]

volumes:
  slotify-postgres-data:

networks:
  slotify-backend: